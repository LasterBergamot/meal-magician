# The single entry point for people, agents and CI (PLAN.md D16). Keep the task list in sync with
# .claude/context/workflow.md. On Arch the binary is `go-task`; use `go-task` where `task` is only
# a shell alias.
#
# Tasks whose inputs land in a later Phase 0 issue exist already and stop with a message that
# names that issue. They are real once the file they need exists.
version: "3"

# Loads .env (git-ignored, see workflow.md) into the environment of every command. A missing
# file is fine.
dotenv: [".env"]

tasks:
  default:
    desc: List the tasks
    silent: true
    cmd: "{{.TASK_EXE}} --list"

  install:
    desc: Resolve the Gradle dependencies and download the Tailwind standalone CLI into .tools/
    cmds:
      - ./gradlew dependencies --quiet > /dev/null
      - bash scripts/install-tailwind.sh

  doctor:
    desc: Check the required tools and their versions (runbook, documentation/Setup.md)
    cmd: bash scripts/doctor.sh

  lint:
    desc: Spotless check and Checkstyle (Javadoc presence)
    cmd: ./gradlew spotlessCheck checkstyleMain

  format:
    desc: Apply the formatters (google-java-format, ktlint)
    cmd: ./gradlew spotlessApply

  serve:
    desc: Run the app with the dev profile on H2 (no Docker needed) and Tailwind --watch next to it
    cmd: bash scripts/serve.sh dev

  "serve:pg":
    desc: Run the app against the compose Postgres with Tailwind --watch (run `task up` first)
    cmd: bash scripts/serve.sh dev,postgres

  test:
    desc: All tests and the 100 % JaCoCo line + branch gate (needs Docker for Testcontainers)
    cmd: ./gradlew test jacocoTestCoverageVerification

  "test:fast":
    desc: Tests without the @Tag("integration") ones, no Docker and no coverage gate (inner loop only)
    cmd: ./gradlew test -Pfast

  "ai:eval":
    desc: "Assistant eval against REAL Gemini models, costs money: `task ai:eval -- --models <id,id> [--runs 3]` (--help needs no login; needs Docker and `gcloud auth application-default login`)"
    # Never in `task test` or CI. Writes build/eval/<timestamp>.md; the owner reviews it (D33).
    cmd: ./gradlew aiEval {{if .CLI_ARGS}}--args='{{.CLI_ARGS}}'{{end}} --console=plain --quiet

  test-e2e:
    desc: Build the image, start compose.e2e.yml (app + Postgres + stub OIDC), run the Playwright tests, tear down
    cmds:
      - task: build
      - task: test-e2e:run

  test-e2e:run:
    desc: Like test-e2e, but uses the meal-magician image that already exists (CI builds it with a layer cache)
    cmds:
      # Tears the stack down (and drops its database volume) even when a step below fails.
      - defer: docker compose -f compose.e2e.yml down --volumes
      - docker compose -f compose.e2e.yml up --detach --wait
      - ./gradlew e2eTest

  smoke:
    desc: "Smoke-test a running service without signing in: `task smoke -- <base-url>` (release.yml runs it after each deploy)"
    # Public pages only, no credentials (scripts/smoke.sh). Locally: run the image or `task serve`
    # and pass its URL, for example `task smoke -- http://localhost:8080`.
    cmd: bash scripts/smoke.sh {{.CLI_ARGS}}

  "db:restore":
    desc: "Restore a database backup: `task db:restore -- <file-or-gs://object> --target local|neon-branch|neon-project [--yes]`"
    # Fetch (gs://, with your own gcloud login), pg_restore into the chosen target. Backups are
    # plain dumps, not encrypted. See scripts/db-restore.sh and the wiki page "Backup and Restore".
    # Delete a dump you downloaded yourself after the restore.
    cmd: bash scripts/db-restore.sh {{.CLI_ARGS}}

  build:
    desc: Build the container image (meal-magician)
    cmd: docker build --tag meal-magician .

  up:
    desc: Start compose.yml (Postgres + pgvector)
    cmd: docker compose up -d --wait

  down:
    desc: Stop compose.yml
    cmd: docker compose down

  migrate-check:
    desc: Flyway migrate + validate on a throw-away Postgres (CI runs it)
    # Runs the Testcontainers test that applies every migration to a pgvector Postgres.
    cmd: ./gradlew test --tests '*PostgresMigrationTests'

  "docs:check":
    desc: Docs tooling checks (also part of `task test`, so CI runs it)
    # CLAUDE.md under 100 lines, router paths exist, every .claude/rules glob matches a file.
    cmd: ./gradlew test --tests '*DocsToolingTests'
