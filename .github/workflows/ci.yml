# Required checks for every PR: "Lint & test", "Migrations (Postgres)" and "E2E".
# Every job calls the same `task` targets a developer runs locally (PLAN.md D16), so "green in CI"
# and "green on my machine" mean the same thing. Job names are the check names that branch
# protection requires, so do not rename them without updating the protection rule.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here needs more than read access; the E2E job adds `security-events` for the SARIF upload.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The Tailwind CLI is a pinned download (scripts/install-tailwind.sh skips it when .tools/
      # holds the pinned version), so cache it under a key that changes with the script.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/install-tailwind.sh') }}
      # The Gradle build runs the Tailwind CLI first and stops if .tools/ is empty.
      - run: task install
      - run: task lint
      # Needs Docker for the Testcontainers tests (the runner has it) and enforces the 100 % gate.
      - run: task test
      - name: Upload test and coverage reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/jacoco
          if-no-files-found: ignore

  migrations:
    name: Migrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The Tailwind CLI is a pinned download (scripts/install-tailwind.sh skips it when .tools/
      # holds the pinned version), so cache it under a key that changes with the script.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/install-tailwind.sh') }}
      - run: task install
      # Applies every Flyway migration to a throw-away pgvector Postgres: H2 can pass where
      # Postgres fails (PLAN.md §7).
      - run: task migrate-check

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The Tailwind CLI is a pinned download (scripts/install-tailwind.sh skips it when .tools/
      # holds the pinned version), so cache it under a key that changes with the script.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/install-tailwind.sh') }}
      - run: task install
      # Playwright downloads Chromium on first use (~/.cache/ms-playwright); the browser build
      # depends on the Playwright version, which lives in the version catalog.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # Builds the image here instead of through `task build` so that BuildKit can keep its layers
      # in the GitHub Actions cache (runners are ephemeral, a local layer cache is always empty).
      # `load: true` puts the result into the local Docker daemon as `meal-magician`, the name
      # compose.e2e.yml and the Trivy scan use. The release workflow still builds with `task build`.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: meal-magician
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Starts compose.e2e.yml and drives Chromium through the stub-OIDC sign-in against the image
      # built above (`task test-e2e` would build it again).
      - run: task test-e2e:run
      # Trivy scans the same image: the e2e run used it, so nothing is built a second time. The
      # table step is the gate (fails on a fixable HIGH/CRITICAL finding); the SARIF step feeds
      # GitHub's code-scanning tab and runs on `main` only, because pull requests from Dependabot
      # and forks get a read-only token.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meal-magician
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan (SARIF)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meal-magician
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload SARIF
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy.sarif
