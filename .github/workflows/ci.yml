name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  image:
    name: Build web container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Podman is preinstalled on the ubuntu-latest runner and matches the
      # engine used for local development. Public env vars aren't needed to
      # validate that the image builds (the landing page doesn't consume them).
      - name: Build image with Podman
        run: podman build -f apps/web/Containerfile -t meal-magician-web:ci .
