# Local Postgres with the pgvector extension, for `task up` / `task serve:pg` (PLAN.md D10).
# Development only: the credentials below are public on purpose and the port is bound to
# localhost. The image is pinned by digest (container.md); to bump it, pull the new tag and copy
# the digest from `docker image inspect pgvector/pgvector:pg17 --format '{{index .RepoDigests 0}}'`.
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: mealmagician
      POSTGRES_USER: mealmagician
      POSTGRES_PASSWORD: mealmagician
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealmagician -d mealmagician"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
